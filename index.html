<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flix Video Editor</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="logo">
            FLIX <span>VIDEO EDITOR</span>
        </div>

        <div class="top-actions">

            <label class="import-btn" for="mediaInput">
                📂 Import
            </label>

            <input
                id="mediaInput"
                type="file"
                accept="video/*,image/*,audio/*"
                hidden
            >

            <button id="newBtn">
                ＋ New
            </button>

            <button id="exportBtn" class="export-btn">
                ⬇ Export
            </button>

        </div>

    </header>


    <!-- EDITOR -->
    <main class="editor">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <button class="tool active" data-tool="media">
                🎬
                <span>Media</span>
            </button>

            <button class="tool" data-tool="text">
                🔤
                <span>Text</span>
            </button>

            <button class="tool" data-tool="filters">
                🎨
                <span>Filters</span>
            </button>

            <button class="tool" data-tool="audio">
                🎵
                <span>Audio</span>
            </button>

            <button class="tool" data-tool="stickers">
                ⭐
                <span>Stickers</span>
            </button>

            <button class="tool" data-tool="transition">
                🎞️
                <span>Transition</span>
            </button>

            <button class="tool" data-tool="speed">
                ⚡
                <span>Speed</span>
            </button>

            <button class="tool" data-tool="crop">
                ✂️
                <span>Crop</span>
            </button>

            <button class="tool" data-tool="ai">
                ✨
                <span>AI Tools</span>
            </button>

            <button class="tool" data-tool="thumbnail">
                🖼️
                <span>Thumbnail</span>
            </button>

        </aside>


        <!-- CENTER -->
        <section class="workspace">

            <!-- PREVIEW -->
            <div class="preview">

                <div id="emptyPreview">

                    <div class="empty-icon">
                        🎬
                    </div>

                    <h2>Flix Video Editor</h2>

                    <p>
                        Import a video or image to start editing
                    </p>

                </div>

                <video
                    id="videoPreview"
                    playsinline
                    preload="metadata">
                </video>

                <img
                    id="imagePreview"
                    alt="Imported image">

                <div
                    id="textOverlay"
                    class="text-overlay">
                </div>

            </div>


            <!-- PLAYER -->
            <div class="player">

                <button id="playBtn">
                    ▶
                </button>

                <span id="currentTime">
                    00:00
                </span>

                <input
                    id="seekBar"
                    type="range"
                    min="0"
                    max="100"
                    value="0">

                <span id="totalTime">
                    00:00
                </span>

                <button id="muteBtn">
                    🔊
                </button>

                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="100"
                    value="100">

            </div>


            <!-- TIMELINE -->
            <div class="timeline">

                <div class="timeline-top">

                    <strong>
                        Timeline
                    </strong>

                    <div>

                        <button id="undoBtn">
                            ↶
                        </button>

                        <button id="redoBtn">
                            ↷
                        </button>

                        <button id="deleteBtn">
                            🗑 Delete
                        </button>

                    </div>

                </div>


                <div class="timeline-ruler">

                    <span>00:00</span>
                    <span>00:05</span>
                    <span>00:10</span>
                    <span>00:15</span>
                    <span>00:20</span>

                </div>


                <div class="track">

                    <div
                        id="timelineClip"
                        class="timeline-clip">
                        No media imported
                    </div>

                </div>

            </div>

        </section>


        <!-- PROPERTIES -->
        <aside class="properties">

            <h2>
                Properties
            </h2>


            <div class="property">

                <label>
                    Text
                </label>

                <input
                    id="textInput"
                    type="text"
                    placeholder="Type your text">

            </div>


            <div class="property">

                <label>
                    Text Size
                </label>

                <input
                    id="textSize"
                    type="range"
                    min="10"
                    max="100"
                    value="40">

            </div>


            <div class="property">

                <label>
                    Brightness
                </label>

                <input
                    id="brightness"
                    type="range"
                    min="50"
                    max="150"
                    value="100">

            </div>


            <div class="property">

                <label>
                    Contrast
                </label>

                <input
                    id="contrast"
                    type="range"
                    min="50"
                    max="150"
                    value="100">

            </div>


            <div class="property">

                <label>
                    Saturation
                </label>

                <input
                    id="saturation"
                    type="range"
                    min="0"
                    max="200"
                    value="100">

            </div>


            <div class="property">

                <label>
                    Blur
                </label>

                <input
                    id="blur"
                    type="range"
                    min="0"
                    max="10"
                    value="0">

            </div>


            <div class="property">

                <label>
                    Aspect Ratio
                </label>

                <select id="aspectRatio">

                    <option value="auto">
                        Original
                    </option>

                    <option value="16/9">
                        16 : 9
                    </option>

                    <option value="9/16">
                        9 : 16
                    </option>

                    <option value="1/1">
                        1 : 1
                    </option>

                    <option value="21/9">
                        21 : 9
                    </option>

                </select>

            </div>


            <!-- EXPORT PROGRESS -->

            <div
                id="exportPanel"
                class="export-panel">

                <div class="export-title">
                    Exporting video...
                </div>

                <div class="progress-background">

                    <div
                        id="exportProgress"
                        class="progress-bar">
                        0%
                    </div>

                </div>

                <div
                    id="exportStatus"
                    class="export-status">
                    Preparing...
                </div>

            </div>

        </aside>

    </main>

</div>

<script src="script.js"></script>

</body>
    </html>
